<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyPortfolio3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        /* ปุ่มเลือกภาษา มุมขวาบน ใช้สีชุดเดียวกับ #legend ของ Interactive-3D-Portfolio.html */
        #lang {
            position: fixed;
            right: 12px;
            top: 12px;
            display: flex;
            gap: 6px;
            z-index: 1;
        }

        #lang button {
            font: 12px/1 monospace;
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            padding: 7px 12px;
            cursor: pointer;
        }

        #lang button.on {
            color: #222;
            background: #ffd479;
            border-color: #ffd479;
        }

        /* ป้ายข้อความลอยบนวัตถุในฉาก (Screen_Housing / Stickman_Flat)
           pointer-events: none บังคับ ไม่งั้นจะดักคลิกที่ OrbitControls */
        .pin-label {
            padding: 4px 9px;
            font: 12px/1 monospace;
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 6px;
            white-space: nowrap;
            pointer-events: none;
            transform: translateY(-100%);
        }

        /* โหมดล็อกกล้องที่ผิวจอ: ปุ่มย้อนกลับ + คำใบ้ Esc
           container เป็น pointer-events: none ให้แค่ปุ่มที่รับ click ได้
           [hidden] ต้องมาด้วย เพราะ display:flex จะ override ค่า hidden ของ browser */
        #focusUI {
            position: fixed;
            left: 12px;
            top: 12px;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }

        #focusUI[hidden] {
            display: none;
        }

        #focusUI button {
            pointer-events: auto;
            font: 12px/1 monospace;
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            padding: 7px 12px;
            cursor: pointer;
        }

        #focusUI button:hover {
            color: #222;
            background: #ffd479;
            border-color: #ffd479;
        }

        #focusHint {
            font: 12px/1 monospace;
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 6px;
            padding: 7px 10px;
        }

        #backBtn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 50;
            color: #fff;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* มือถือ: ปุ่ม/ตัวหนังสือข้างบนต้องแตะง่าย (เป้าแตะ ~44px) + กัน focusUI ซ้อนปุ่ม Back */
        @media (max-width: 600px) {
            #backBtn {
                top: 10px;
                left: 10px;
                font-size: 1rem;
                padding: 12px 16px;
            }

            #lang {
                right: 10px;
                top: 10px;
            }

            #lang button {
                font-size: 15px;
                padding: 12px 16px;
            }

            #focusUI {
                left: 10px;
                top: 64px;
            }

            #focusUI button,
            #focusHint {
                font-size: 15px;
                padding: 12px 14px;
            }

            .pin-label {
                font-size: 14px;
                padding: 6px 12px;
            }
        }
    </style>
</head>

<body>
    <a href="index.html" id="backBtn">&larr; Back</a>
    <!-- เลือกภาษา: เปลี่ยนทั้งภาพบนจอและข้อความป้าย เริ่มต้นไทย -->
    <div id="lang">
        <button type="button" data-lang="th" class="on">ไทย</button>
        <button type="button" data-lang="en">English</button>
    </div>

    <!-- โหมดล็อกกล้องที่ Screen_Surface: ออกได้ด้วยปุ่มย้อนกลับหรือ Esc -->
    <div id="focusUI" hidden>
        <button type="button" id="focusBack">ย้อนกลับ</button>
        <span id="focusHint">กด Esc เพื่อออก</span>
    </div>

    <!-- core three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>

    <script>

        const renderer = new THREE.WebGLRenderer();
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); // จอ HiDPI ต้อง render เต็มความละเอียด ไม่งั้นตัวหนังสือเบลอตอนซูม
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Shadow
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // renderer ของป้ายข้อความ CSS2D แยกอีกชั้น ไม่เกี่ยวกับฉาก 3D
        // pointer-events: none ที่ domElement เพื่อไม่ให้ป้ายไปดัก pointer ของ canvas
        const labelRenderer = new THREE.CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const scene = new THREE.Scene();


        const camera = new THREE.PerspectiveCamera(
            20,
            window.innerWidth / window.innerHeight,
            0.5,
            1000
        );
        camera.position.set(5, 2, 5);
        camera.lookAt(0, 0, 0);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);


        // ไฟขาวทั้งชุดถอยให้ไฟเหลืองที่ตัวละครเด่นกว่า (ดูค่า STICK_SPOT_* ที่ล่าง)
        // pointLight ตัวนี้สำคัญที่สุด มันอยู่ที่ (0,2,0) คือตรงเหนือหัวตัวละคร
        // และไม่มี distance/decay แปลว่าไม่ตกผลเลย ความสว่างเต็มไปทั้งฉากตลอดเวลา
        const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x888888, 0.2);
        scene.add(hemisphereLight);

        const pointLight = new THREE.PointLight(0xffffff, 0.4);
        pointLight.position.set(0, 2, 0);
        pointLight.castShadow = true;
        scene.add(pointLight);

        const fillLight = new THREE.PointLight(0xfff0dd, 0.4);
        fillLight.position.set(2, 1.5, 2);
        scene.add(fillLight);




        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(10, 10, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        scene.background = new THREE.Color(0xffffff);

        // โฟลเดอร์เก็บไฟล์ 3 มิติทั้งหมด (โมเดลใน 3D/ และภาพบนจอใน 3D/screen/)
        // เก็บ path ที่ใช้จริงไว้ที่เดียว ทุกจุดต้องต่อยอดจากตัวนี้
        // ชื่อโฟลเดอร์ต้องเป็น Model3D (ไม่ใช่ Model) ตามที่ Next-Gen-Rendering.html และ Interactive-3D-Portfolio.html ใช้
        const ASSET_BASE = 'Model3D/3D/';

        // โมเดลทั้ง 16 ไฟล์ export จาก model.blend ไฟล์เดียวกัน จึงอยู่ใน world space ชุดเดียวกัน
        // (ชื่อ node กับค่า translation ตรงกับ Model3D/Room.glb ทุกตัว) โหลดแล้วใส่ตำแหน่งเดิมได้เลย
        // Text.glb = ข้อความ 3 มิติ ติดอยู่บนผนังซ้ายหันหน้าเข้าห้อง อยู่ในกรอบเดียวกับห้อง
        // จึงไม่เปลี่ยนการจัดวางฉาก ไม่ต้องวางตำแหน่งเพิ่ม (ไม่อยู่ในโซนที่บังจอ จึงไม่ต้องซ่อนตอนฟักส์)
        // ต้องรวมเป็นกลุ่มเดียวก่อนหาขอบเขต ไม่งั้นแต่ละชิ้นจะถูกจัดวางใหม่แยกกันทีละกลุ่ม
        const MODEL_FILES = [
            'RoomModel.glb',
            'Classroom_Board_StandardModel.glb',
            'ProjectorScreenModel.glb',
            'FanModel.glb',
            'MusicStandSheetPlateModel.glb',
            'Stickman_Flat.glb',
            'Text.glb',
            'Decor_Plants.glb',
            'Decor_SmallProps.glb',
            'Decor_Zone.glb',
            'BronzeCoin.glb',
            'GoldCoin.glb',
            'SilverCoin.glb',
            'Wall_ClockPoster.glb',
            'Wall_Curtain.glb',
            'Wall_Shelf.glb'
        ];

        const classroom = new THREE.Group();
        scene.add(classroom);

        const clock = new THREE.Clock();
        let screenMixer = null;
        let pending = MODEL_FILES.length;

        // เลือกภาษา: เปลี่ยนทั้งภาพบนจอ (TH.png/EN.png) และข้อความป้าย เริ่มต้นไทย
        const LANG = {
            th: { btn: 'ไทย', open: 'เปิด', close: 'ปิด', play: 'เล่น', pause: 'หยุด', texture: ASSET_BASE + 'screen/TH.png', back: 'ย้อนกลับ', hint: 'กด Esc เพื่อออก' },
            en: { btn: 'English', open: 'open', close: 'close', play: 'play', pause: 'pause', texture: ASSET_BASE + 'screen/EN.png', back: 'Back', hint: 'Press Esc to exit' }
        };
        let lang = 'th';

        // ===== โชว์ Shader 3 เหรียญ (Gold=Cel / Silver=PBR / Bronze=Vertex) =====
        // PBR ใช้ไฟเดิมในฉากเท่านั้น ไม่เพิ่ม envMap/HDRI ตามที่ตกลงกัน
        const MEDAL_INFO = {
            gold: {
                th: { tag: 'ทอง: Cel Shading', hint: 'เหรียญทอง Cel (Toon 3-step + ขอบดำ) — กด Esc เพื่อออก' },
                en: { tag: 'Gold: Cel', hint: 'Gold medal Cel (Toon 3-step + outline) — Press Esc to exit' }
            },
            silver: {
                th: { tag: 'เงิน: PBR', hint: 'เหรียญเงิน PBR (metalness 1 / roughness 0.28) — กด Esc เพื่อออก' },
                en: { tag: 'Silver: PBR', hint: 'Silver medal PBR (metalness 1 / roughness 0.28) — Press Esc to exit' }
            },
            bronze: {
                th: { tag: 'ทองแดง: Vertex Shader', hint: 'เหรียญทองแดง Vertex wobble (sine บน normal) — กด Esc เพื่อออก' },
                en: { tag: 'Bronze: Vertex', hint: 'Bronze medal Vertex wobble (sine on normal) — Press Esc to exit' }
            }
        };
        const PBR_PARAMS = { metalness: 1.0, roughness: 0.28 };
        const CEL_OUTLINE_COLOR = 0x111111;
        const CEL_OUTLINE_SCALE = 1.03;
        // Cel เข้มเฉพาะเหรียญทอง (Silver ไม่ใช้ Cel แล้ว): 5-step แถบแข็งกว่า + ขอบหนากว่า
        const GOLD_CEL_STEPS = [70, 130, 180, 220, 255];
        const GOLD_CEL_OUTLINE_SCALE = 1.05;
        const BRONZE_WOBBLE_AMP = 0.03; // local space กันเพี้ยนหลัง frameClassroom() scale
        const MEDAL_FOCUS_MARGIN = 2.0; // เหรียญเล็กกว่าจอมาก ต้องเผื่อขอบเยอะกว่า FOCUS_MARGIN
        const MEDAL_FOCUS_MIN_DIST = 0.9; // กันกล้องจมเข้าใกล้จนต่ำกว่า near (0.5)
        // ไฟส่องเหรียญเฉพาะ (ลอกแพทเทิร์น STICK_SPOT_*: r128 ปิด physicallyCorrectLights
        // distance/decay ต้อง > 0 ไม่งั้นไฟไม่ตกผล; castShadow=false กัน acne บนเหรียญจิ๋ว)
        // ไม่แตะไฟเดิม 4 ดวงในฉาก (ที่หรี่ไว้ให้สปอตเหลืองตัวละครเด่น)
        const MEDAL_SPOT_COLOR = 0xffffff;
        const MEDAL_SPOT_INTENSITY = 4;
        const MEDAL_SPOT_ANGLE = 0.5;
        const MEDAL_SPOT_PENUMBRA = 0.5;
        const MEDAL_SPOT_DISTANCE = 4;
        const MEDAL_SPOT_DECAY = 2;
        const MEDAL_SPOT_HEIGHT = 0.35; // เหนือยอดเหรียญ (หน่วยโลกหลัง scale)
        const MEDAL_SPOT_FRONT = 0.5; // ด้านหน้าเหรียญ
        const medalSpots = []; // [{ kind, spot }]
        let medalGoldRoot = null;
        let medalSilverRoot = null;
        let medalBronzeRoot = null;
        let medalGoldLabel = null;
        let medalSilverLabel = null;
        let medalBronzeLabel = null;
        let medalFocus = null; // null | 'gold' | 'silver' | 'bronze' (โหมด inspect: ไม่ล็อกกล้อง)
        // จุดคืนกล้องตอนเลิก inspect (แยกจากของจอ กันทับกัน)
        // จำเฉพาะตอนเริ่ม inspect จากสถานะว่าง ไม่จำตอนสลับเหรียญ A->B (ไม่งั้นจุดคืนกลายเป็นวิวเหรียญ A)
        const savedMedalPos = new THREE.Vector3();
        const savedMedalTarget = new THREE.Vector3();
        let hasSavedMedal = false;
        const bronzeTime = { value: 0 }; // uniform กลาง แชร์ให้ทุก material ทองแดง (อัปเดตที่เดียวใน animate)

        // ความสว่างภาพบนจอ: ผิวจอเป็น emissive ล้วน (ไม่รับแสงในฉาก)
        // มากกว่านี้ = สว่างขึ้น (1.1-1.4) / น้อยกว่านี้ = มืดลง (0.6-0.8)
        const SCREEN_EMISSIVE = 0.9;

        const screenTextures = {};
        let screenSurface = null; // ผิวจอ เอาไปวางภาพตามภาษา
        let screenHousing = null; // กล่องบนจอ = ปุ่มเปิด/ปิดภาพฉาย
        let screenLabel = null; // ป้ายข้อความ CSS2DObject ผูกไว้ใต้กล่อง

        // Projector screen animation - 4 clips from model.blend
        const SCREEN_CLIPS = {
            closed: 'ACT_01_Screen_Closed',
            open: 'ACT_02_Screen_Open',
            opening: 'ACT_03_Screen_Opening',
            closing: 'ACT_04_Screen_Closing'
        };
        const screenActions = {};

        // สถานะจอแยกจาก clip เพื่อให้เงื่อนไขกดอ่านตรง ๆ ไม่ต้องเดา scale
        // คลิกกล่องจอเพื่อสลับ: ปิด -> เปิด (ACT_03) / เปิด -> ปิด (ACT_04)
        const SCREEN_STATE = { CLOSED: 'closed', OPEN: 'open', OPENING: 'opening', CLOSING: 'closing' };
        const CLIP_TO_STATE = {};
        CLIP_TO_STATE[SCREEN_CLIPS.closed] = SCREEN_STATE.CLOSED;
        CLIP_TO_STATE[SCREEN_CLIPS.open] = SCREEN_STATE.OPEN;
        CLIP_TO_STATE[SCREEN_CLIPS.opening] = SCREEN_STATE.OPENING;
        CLIP_TO_STATE[SCREEN_CLIPS.closing] = SCREEN_STATE.CLOSING;
        let screenState = SCREEN_STATE.CLOSED;

        // ตัวละครนักนำวางไม้ (Stickman_Flat.glb) - rigged 15 ข้อต่อ มี clip เดียว
        // ไม่เล่นอัตโนมัติ ต้องคลิกที่ตัวละครถึงจะเล่น (คลิกซ้ำ = หยุดชั่วคราว)
        const STICKMAN_CLIP = 'ACT_05_Stickman_Conduct_120f';
        // Mat_Stick_Black ในไฟล์เป็นสีดำเกือบสนิท (baseColor 0.012) เห็นเป็นเงาดำล้วน อ่อนให้เห็นเป็นทรง 3 มิติ
        const STICKMAN_BODY_COLOR = 0x4d4d4d;

        // แสงเหลืองไฮไลต์ตัวละคร คุมค่าไว้ที่นี่ ปรับง่ายกว่าไล่หาในโค้ด
        // distance กับ decay ต้อง > 0 ทั้งคู่ เพราะ r128 ปิด physicallyCorrectLights ไว้
        // ถ้าค่าไหนเป็น 0 ไฟจะกลายเป็นไม่ตกผล ความสว่างจะท่วมทั้งฉาก
        const STICK_SPOT_COLOR = 0xffd479; // เหลืองวรรณอนเดียวกับปุ่มภาษาใน #lang
        const STICK_SPOT_INTENSITY = 4;
        const STICK_SPOT_ANGLE = 0.55; // rad (~32°) ครอมครึ่งความกว้างตัวละคร 0.3 หน่วย
        const STICK_SPOT_PENUMBRA = 0.6; // ขอบวงมัว ไม่เป็นวงแข็ง
        const STICK_SPOT_DISTANCE = 4; // หน่วยโลก
        const STICK_SPOT_DECAY = 2;
        const STICK_SPOT_HEIGHT = 0.15; // สูงกว่ายอดตัวละคร (หน่วยโลก)
        const STICK_SPOT_FRONT = 0.7; // ด้านหน้าตัวละคร (+Z คือหน้าที่ตัวละครหันไป)
        let stickmanRoot = null;
        let stickmanMixer = null;
        let stickmanAction = null;
        let stickmanPlaying = false;
        let stickLabel = null; // ป้ายข้อความ CSS2DObject ลอยเหนือหัวตัวละคร บอกว่าจะกดแล้วเล่น/หยุด
        let stickSpot = null; // SpotLight สีเหลือง เปิดตอนชี้ตัวละครหรือกำลังเล่น animation

        // raycast หา Screen_Housing
        const raycaster = new THREE.Raycaster();
        const pointerNDC = new THREE.Vector2();
        let pointerX = 0, pointerY = 0;
        let pointerInside = false;
        const CLICK_MAX_DRAG = 5; // px ขยับน้อยกว่านี้ถือว่าเป็นการคลิก ไม่ใช่การลากหมุนมุมมอง
        let pointerDownX = 0, pointerDownY = 0;

        function playScreenAction(clipName) {
            if (!screenMixer || !screenActions[clipName]) return;
            for (const key in screenActions) {
                screenActions[key].stop();
            }
            const action = screenActions[clipName];
            action.reset();
            action.setLoop(THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            action.play();
            screenState = CLIP_TO_STATE[clipName];
            console.log('Screen animation:', clipName, '-> state:', screenState);
        }

        // เปิดได้เฉพาะตอนปิดนิ่งเท่านั้น (ระหว่างยุบ/กางอยู่ให้กดอีกไม่ได้)
        function canOpenScreen() {
            return !!screenMixer && screenState === SCREEN_STATE.CLOSED;
        }

        // ปิดได้เฉพาะตอนเปิดนิ่งเท่านั้น
        function canCloseScreen() {
            return !!screenMixer && screenState === SCREEN_STATE.OPEN;
        }

        // คลิกกล่องจอเพื่อสลับ: ปิด -> เปิด, เปิด -> ปิด
        // ระหว่างกำลังยุบ/กางอยู่ ทั้งสองเงื่อนไขเป็น false เท่านั้น จึงกดซ้ำไม่ได้
        function toggleScreen() {
            if (canOpenScreen()) {
                playScreenAction(SCREEN_CLIPS.opening);
            } else if (canCloseScreen()) {
                playScreenAction(SCREEN_CLIPS.closing);
            }
        }

        // คลิกตัวละคร = เล่น/หยุดชั่วคราว ใช้ raycast หา object แล้วสั่ง action แบบ picking_sample.html
        // เริ่มจาก reset() เสมอ เพื่อให้กดซ้ำแล้วเล่นใหม่ตั้งแต่เฟรมแรก
        function toggleStickman() {
            if (!stickmanAction) return;
            if (stickmanPlaying) {
                stickmanPlaying = false;
                console.log('Stickman: paused at', stickmanAction.time.toFixed(2));
                return;
            }
            stickmanAction.reset();
            stickmanAction.play();
            stickmanPlaying = true;
            console.log('Stickman animation:', STICKMAN_CLIP);
        }

        // raycast หาตัวละครทั้งกลุ่ม (gltf.scene เป็น Group ต้อง intersect แบบ recursive)
        // ข้อจำกัดของ r128: raycast บน SkinnedMesh ใช้ทรง bind pose ไม่ตามท่าที่กำลังเล่น
        // จึงคลิกลำตัว/หัว/ขาได้เสมอ แต่ช่วงที่แขนกำลังกวาดอาจคลิกไม่โดน
        function pickStickman() {
            if (!stickmanRoot || !pointerInside || focusMode || medalFocus) return false;
            pointerNDC.x = (pointerX / window.innerWidth) * 2 - 1;
            pointerNDC.y = -(pointerY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointerNDC, camera);
            return raycaster.intersectObject(stickmanRoot, true).length > 0;
        }

        // เมื่อ clip ยุบ/กางเล่นจบ state ต้องกลับเป็นค่าคงที่ (ปิด/เปิด) ด้วย
        // ไม่งั้น state จะค้างที่ closing/opening แล้วกดอะไรไม่ได้อีก
        // เช็คด้วย isRunning() ซึ่ง false เมื่อเล่นจบแล้ว (LoopOnce + clampWhenFinished)
        function settleScreenState() {
            if (screenState === SCREEN_STATE.OPENING) {
                const action = screenActions[SCREEN_CLIPS.opening];
                if (action && !action.isRunning() && action.time > 0) {
                    screenState = SCREEN_STATE.OPEN;
                    console.log('Screen settled:', screenState);
                }
            } else if (screenState === SCREEN_STATE.CLOSING) {
                const action = screenActions[SCREEN_CLIPS.closing];
                if (action && !action.isRunning() && action.time > 0) {
                    screenState = SCREEN_STATE.CLOSED;
                    console.log('Screen settled:', screenState);
                }
            }
        }

        // ยิง raycast ที่ Screen_Housing
        // (ตอนจอกาง ผิวจอทับกล่องอยู่ ถ้ายิงรวมทั้งชุดต้องใช้ระยะจริง)
        // ล็อกเหรียญอยู่ picking ไม่ทำงาน ออกด้วย Back/Esc เท่านั้น
        function pickHousing() {
            if (!screenHousing || !pointerInside || medalFocus) return false;
            pointerNDC.x = (pointerX / window.innerWidth) * 2 - 1;
            pointerNDC.y = -(pointerY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointerNDC, camera);
            return raycaster.intersectObject(screenHousing, false).length > 0;
        }

        // ===== โหมดล็อกกล้องที่ผิวจอ =====
        // คลิก Screen_Surface ตอนจอเปิดนิ่งแล้ว ให้กล้องลอยไปตั้งตรงหน้าจอและล็อกไว้
        // ออกได้ทางเดียว: ปุ่มย้อนกลับ หรือ Esc
        const FOCUS_MARGIN = 1.15; // เว้นขอบจอไว้เล็กน้อย ไม่ให้เต็มขอบจนขาด
        const FOCUS_TWEEN_MS = 450; // ย้ายกล้องแบบลื่น ไม่ให้ภาพกระตุก
        let focusMode = false;
        let savedCameraPos = new THREE.Vector3();
        let savedTarget = new THREE.Vector3();
        const focusNormal = new THREE.Vector3();
        const focusCenter = new THREE.Vector3();
        const focusPos = new THREE.Vector3();
        let focusAnim = null;

        // วัตถุที่ยืนระหว่างกล้องกับจอ (แท่นเพลง ตัวละคร และเหรียญ 3 เหรียญ) จะบังภาพตอนกล้องล็อกหน้าจอ
        // จึงซ่อนชั่วคราวเฉพาะตอนอยู่ในโหมดนี้ ตอนหมุนมุมมองปกติยังเห็นครบ
        const focusHidden = [];

        const focusUI = document.getElementById('focusUI');
        const focusBack = document.getElementById('focusBack');
        const focusHint = document.getElementById('focusHint');
        // ปุ่ม ← Back ของเพจอยู่มุมเดียวกับ focusUI (ซ้อนกันตอน inspect/ล็อกจอ)
        // โชว์ focusUI เมื่อไหร่ให้ซ่อนปุ่มเพจชั่วคราว เหลือแถวเดียว ไม่สับสนว่ามีปุ่มย้อนกลับ 2 ปุ่ม
        const backBtnEl = document.getElementById('backBtn');

        // ยิง raycast ที่ Screen_Surface (ผิวจอ) คนละชุดกับกล่องจอ
        function pickSurface() {
            if (!screenSurface || !pointerInside || medalFocus) return false;
            pointerNDC.x = (pointerX / window.innerWidth) * 2 - 1;
            pointerNDC.y = -(pointerY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointerNDC, camera);
            return raycaster.intersectObject(screenSurface, false).length > 0;
        }

        // เข้าโหมดโฟกัสได้เฉพาะจอเปิดนิ่งเท่านั้น
        // ตอนปิด/กำลังยุบ/กำลังกาง ผิวจอย่อจนคลิกยากและความหมายก็ยังไม่ชัด จึงไม่เปิดโหมด
        function canFocusScreen() {
            return !!screenSurface && screenState === SCREEN_STATE.OPEN;
        }

        // คำนวณตำแหน่งกล้องที่หันหน้าเข้าหาจอพอดีโดยไม่ต้อง hardcode
        // 1. หากล่องขอบเขตผิวจอใน world space -> จุดกลาง + ขนาด
        // 2. หาแกนตัวเองที่บางที่สุดของกล่อง แปลงด้วย matrixWorld -> normal ของผิวจอ
        //    (หันให้ชี้เข้าหากล้อง เพราะคลิกผิวจอได้แปลว่ากล้องอยู่ฝั่งที่มองเห็นหน้าจออยู่แล้ว)
        // 3. ระยะถอยกล้องคำนวณจาก fov แนวตั้ง + aspect ให้จอเต็มเฟรมพร้อมขอบ
        // คืน false เมื่อคำนวณไม่ได้ เช่น กล่องยุบเป็นศูนย์หรือเสีย ไม่ให้ผู้เรียกทำงานต่อ
        function frameScreenCamera() {
            return frameObjectCamera(screenSurface, FOCUS_MARGIN, 0);
        }

        // ซ่อน/คืนวัตถุที่บังจอ เรียกตอนเข้าและออกจากโหมดล็อกกล้อง
        function setFocusHidden(hidden) {
            for (const obj of focusHidden) obj.visible = !hidden;
        }

        function enterScreenFocus() {
            if (focusMode || medalFocus || !canFocusScreen()) return;
            if (!frameScreenCamera()) return; // คำนวณมุมกล้องไม่ได้ ก็ไม่ล็อก
            enterFocusCommon();
            medalFocus = null;
            hasSavedMedal = false; // จอยึดวิวปัจจุบัน (วิวเหรียญ) เป็นจุดคืนของมันแทน ไม่ซ้อน restore 2 ชั้น
            setFocusHidden(true); // แท่นเพลงกับตัวละครอยู่ระหว่างกล้องกับจอ ต้องซ่อนไม่ให้บังจอ
            focusHint.textContent = LANG[lang].hint;
            console.log('Screen focus: locked');
        }

        function exitScreenFocus() {
            if (!focusMode) return;
            focusMode = false;
            medalFocus = null;
            hasSavedMedal = false;
            setFocusHidden(false); // คืนแท่นเพลงกับตัวละครกลับเข้าฉาก
            focusAnim = null;
            camera.position.copy(savedCameraPos);
            controls.target.copy(savedTarget);
            controls.enabled = true;
            controls.enablePan = true; // กันกรณีเคย inspect เหรียญ (pan ถูกปิด) มาก่อนล็อกจอ
            focusUI.hidden = true;
            backBtnEl.style.display = '';
            console.log('Screen focus: released');
        }

        // ===== Shader 3 เหรียญ: Gold Cel / Silver PBR / Bronze Vertex =====
        // PBR: คงสี/map เดิมของไฟล์ไว้ ปรับแค่ metalness/roughness ให้เห็น PBR ชัด
        // (ไม่เพิ่ม envMap/HDRI/ไฟใหม่ ใช้ไฟเดิม 4 ดวงในฉากเท่านั้น)
        function applyPBR(root, label) {
            let n = 0;
            root.traverse((child) => {
                if (!child.isMesh) return;
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                mats.forEach((m) => {
                    if (m && m.isMeshStandardMaterial) {
                        m.metalness = PBR_PARAMS.metalness;
                        m.roughness = PBR_PARAMS.roughness;
                        m.needsUpdate = true;
                        n++;
                    }
                });
            });
            if (!n) console.error('PBR: no MeshStandardMaterial found in ' + label);
            else console.log('PBR applied to', label, n, 'material(s): metalness', PBR_PARAMS.metalness, 'roughness', PBR_PARAMS.roughness);
        }

        // Cel: gradientMap สำหรับ MeshToonMaterial (r128 ใช้ LuminanceFormat + NearestFilter)
        // รับ steps ได้ (default 3-step เดิม) แคชตามค่า steps
        const celGradientMaps = {};
        function getCelGradientMap(steps) {
            const key = (steps || [90, 160, 255]).join(',');
            if (celGradientMaps[key]) return celGradientMaps[key];
            const arr = new Uint8Array(steps || [90, 160, 255]);
            const tex = new THREE.DataTexture(arr, arr.length, 1, THREE.LuminanceFormat);
            tex.minFilter = THREE.NearestFilter;
            tex.magFilter = THREE.NearestFilter;
            tex.generateMipmaps = false;
            tex.needsUpdate = true;
            celGradientMaps[key] = tex;
            return tex;
        }

        // Cel: แทนทุก mesh ด้วย Toon + คงสีเดิมของชิ้นนั้นไว้
        // แล้วแปะเปลือก outline (inverted hull) เป็น child ของแต่ละ mesh
        // opts: { steps, outlineScale } — default คงเดิม 3-step + CEL_OUTLINE_SCALE
        function applyCel(root, label, opts) {
            const o = opts || {};
            const steps = o.steps || [90, 160, 255];
            const outlineScale = o.outlineScale || CEL_OUTLINE_SCALE;
            const gradientMap = getCelGradientMap(steps);
            let n = 0;
            const meshes = [];
            root.traverse((child) => { if (child.isMesh && !child.userData.isOutline) meshes.push(child); });
            meshes.forEach((mesh) => {
                const orig = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;
                const baseColor = (orig && orig.color) ? orig.color.clone() : new THREE.Color(0xc0c6cc);
                mesh.material = new THREE.MeshToonMaterial({ color: baseColor, gradientMap: gradientMap });
                const outline = new THREE.Mesh(
                    mesh.geometry,
                    new THREE.MeshBasicMaterial({ color: CEL_OUTLINE_COLOR, side: THREE.BackSide })
                );
                outline.scale.multiplyScalar(outlineScale);
                outline.castShadow = false;
                outline.receiveShadow = false;
                outline.userData.isOutline = true;
                mesh.add(outline);
                n++;
            });
            if (!n) console.error('Cel: no mesh found in ' + label);
            else console.log('Cel applied to', label, n, 'mesh(es): Toon ' + steps.length + '-step + outline x' + outlineScale);
        }

        // Bronze: ฉีด vertex shader ผ่าน onBeforeCompile คงแสง/เงาเดิมไว้
        // ขยับจุดยอดตาม normal ด้วย sine 2 ชั้น (uTime มาจาก bronzeTime ที่ animate อัปเดต)
        function applyBronzeVertex(root) {
            let n = 0;
            const seen = new Set();
            root.traverse((child) => {
                if (!child.isMesh || child.userData.isOutline) return;
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                mats.forEach((m) => {
                    if (m && m.isMeshStandardMaterial && !seen.has(m)) {
                        seen.add(m);
                        m.onBeforeCompile = (shader) => {
                            shader.uniforms.uTime = bronzeTime;
                            shader.vertexShader = 'uniform float uTime;\n' + shader.vertexShader.replace(
                                '#include <begin_vertex>',
                                '#include <begin_vertex>\n' +
                                'float bronzeW = sin(position.y * 12.0 + uTime * 2.5) * 0.5 + sin(position.x * 9.0 - uTime * 1.8) * 0.5;\n' +
                                'transformed += normal * bronzeW * ' + BRONZE_WOBBLE_AMP.toFixed(3) + ';'
                            );
                        };
                        m.customProgramCacheKey = () => 'bronzeWobble';
                        m.needsUpdate = true;
                        n++;
                    }
                });
            });
            if (!n) console.error('Bronze Vertex: no MeshStandardMaterial found in BronzeCoin.glb');
            else console.log('Bronze Vertex applied to', n, 'material(s): sine wobble amp', BRONZE_WOBBLE_AMP);
        }

        // ป้ายลอยเหนือเหรียญ: วัด local space ก่อน frameClassroom() scale (แบบเดียวกับ stickLabel)
        function attachMedalLabel(root, kind) {
            root.updateMatrixWorld(true);
            const toLocal = new THREE.Matrix4().copy(root.matrixWorld).invert();
            const box = new THREE.Box3().setFromObject(root).applyMatrix4(toLocal);
            if (box.isEmpty()) return null;
            const labelEl = document.createElement('div');
            labelEl.className = 'pin-label';
            const label = new THREE.CSS2DObject(labelEl);
            const c = box.getCenter(new THREE.Vector3());
            label.position.set(c.x, box.max.y + 0.15, c.z);
            label.visible = false;
            root.add(label);
            return label;
        }

        function refreshMedalLabels() {
            const setOne = (label, kind) => {
                if (!label) return;
                const want = MEDAL_INFO[kind][lang].tag;
                if (label.element.textContent !== want) label.element.textContent = want;
            };
            setOne(medalGoldLabel, 'gold');
            setOne(medalSilverLabel, 'silver');
            setOne(medalBronzeLabel, 'bronze');
        }

        // raycast หาเหรียญทั้งกลุ่ม (รวม outline child ด้วย กดโดนขอบก็ถือว่าโดนเหรียญ)
        // ล็อกเหรียญอยู่ไม่รับ picking ซ้ำ ออกด้วย Back/Esc เท่านั้น
        function pickMedal(root) {
            if (!root || !pointerInside || focusMode || medalFocus) return false;
            pointerNDC.x = (pointerX / window.innerWidth) * 2 - 1;
            pointerNDC.y = -(pointerY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointerNDC, camera);
            return raycaster.intersectObject(root, true).length > 0;
        }

        // คำนวณกล้องโฟกัสวัตถุชิ้นใดก็ได้ (จอใช้ margin เดิม เหรียญใช้ margin ใหญ่กว่า + กันระยะใกล้สุด)
        function frameObjectCamera(obj, margin, minDist) {
            if (!obj) return false;
            const box = new THREE.Box3().setFromObject(obj);
            if (box.isEmpty()) return false;
            const size = box.getSize(new THREE.Vector3());
            if (size.x <= 0 || size.y <= 0 || size.z <= 0) return false;
            focusCenter.copy(box.getCenter(new THREE.Vector3()));
            const minAxis = (size.x < size.y && size.x < size.z) ? 0 : (size.y < size.z ? 1 : 2);
            focusNormal.set(0, 0, 0).setComponent(minAxis, 1);
            obj.updateWorldMatrix(true, false);
            focusNormal.transformDirection(obj.matrixWorld).normalize();
            if (focusNormal.dot(camera.position.clone().sub(focusCenter)) < 0) focusNormal.negate();
            const vFov = THREE.MathUtils.degToRad(camera.fov);
            const distV = (size.y * 0.5 * margin) / Math.tan(vFov * 0.5);
            const hFov = 2 * Math.atan(Math.tan(vFov * 0.5) * camera.aspect);
            const distH = (size.x * 0.5 * margin) / Math.tan(hFov * 0.5);
            const dist = Math.max(Math.max(distV, distH), minDist || 0);
            focusPos.copy(focusCenter).addScaledVector(focusNormal, dist);
            return true;
        }

        function enterFocusCommon() {
            savedCameraPos.copy(camera.position);
            savedTarget.copy(controls.target);
            focusMode = true;
            focusAnim = {
                start: performance.now(),
                fromPos: camera.position.clone(),
                toPos: focusPos.clone(),
                fromTarget: controls.target.clone(),
                toTarget: focusCenter.clone()
            };
            controls.enabled = false;
            focusUI.hidden = false;
            backBtnEl.style.display = 'none';
            setLabel(screenLabel, '', false);
        }

        // ===== โหมด inspect เหรียญ: ล็อก picking จนกว่าจะออกด้วยปุ่ม/Esc =====
        // คลิกเหรียญแล้วกล้องหันเป้าไปหาเหรียญ (tween 450ms) แต่ controls ยังเปิดอยู่:
        // หมุนรอบ (rotate) + ซูม (zoom) ได้, ปิดแค่ pan เป้าจะได้ไม่หลุดจากเหรียญ
        // ต่างจากจอ (enterScreenFocus) ที่ controls.enabled=false ต้องออกด้วย Back/Esc
        // ระหว่างล็อก คลิกฉากทั้งหมดไม่ทำงาน (จอ/กล่องจอ/ตัวละคร/เหรียญอื่น/ที่ว่าง) ออกได้แค่ Back/Esc
        function enterMedalInspect(kind) {
            if (focusMode || medalFocus) return; // ล็อกเหรียญอยู่ คลิกซ้ำ/สลับเหรียญไม่ทำอะไร ออกด้วย Back/Esc เท่านั้น
            const root = medalRootOf(kind);
            if (!root) return;
            if (!frameObjectCamera(root, MEDAL_FOCUS_MARGIN, MEDAL_FOCUS_MIN_DIST)) return; // คำนวณมุมไม่ได้ก็ไม่เล็ง
            // จำจุดคืนเฉพาะตอนเริ่มจากสถานะว่าง (เข้าถึงจุดนี้ได้เฉพาะตอนยังไม่ล็อก เพราะการ์ดด้านบน)
            if (!medalFocus) {
                savedMedalPos.copy(camera.position);
                savedMedalTarget.copy(controls.target);
                hasSavedMedal = true;
            }
            focusAnim = {
                start: performance.now(),
                fromPos: camera.position.clone(),
                toPos: focusPos.clone(),
                fromTarget: controls.target.clone(),
                toTarget: focusCenter.clone()
            };
            medalFocus = kind;
            controls.enabled = true;
            controls.enableZoom = true;
            controls.enableRotate = true;
            controls.enablePan = false;
            focusUI.hidden = false;
            backBtnEl.style.display = 'none';
            focusHint.textContent = MEDAL_INFO[kind][lang].hint;
            console.log('Medal inspect: aim ->', kind);
        }

        // เลิก inspect = ลอยกล้องกลับจุดก่อนคลิก (tween ผ่าน focusAnim เดิม) + เปิด pan คืน
        // ครอบคลุมทั้ง 4 ทางออก: คลิกเหรียญซ้ำ / คลิกพื้นที่ว่าง / Back / Esc / คลิกตัวละคร
        function exitMedalInspect() {
            if (!medalFocus) return;
            medalFocus = null;
            controls.enabled = true;
            controls.enablePan = true;
            focusUI.hidden = true;
            backBtnEl.style.display = '';
            if (hasSavedMedal) {
                hasSavedMedal = false;
                focusAnim = {
                    start: performance.now(),
                    fromPos: camera.position.clone(),
                    toPos: savedMedalPos.clone(),
                    fromTarget: controls.target.clone(),
                    toTarget: savedMedalTarget.clone()
                };
            } else {
                focusAnim = null;
            }
            console.log('Medal inspect: cleared (camera restored)');
        }

        function medalRootOf(kind) {
            return kind === 'gold' ? medalGoldRoot : kind === 'silver' ? medalSilverRoot : medalBronzeRoot;
        }

        // easeInOutCubic ให้เริ่มช้า เร็วกลาง แล้วจบช้า
        function easeInOutCubic(k) {
            return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
        }

        function applyLanguage() {
            const texture = screenTextures[lang];
            if (!screenSurface || !texture) return;
            screenSurface.material.map = texture;
            screenSurface.material.emissiveMap = texture;
            screenSurface.material.emissive = new THREE.Color(0xffffff);
            screenSurface.material.emissiveIntensity = SCREEN_EMISSIVE;
            screenSurface.material.needsUpdate = true;
            console.log('Screen language:', lang);
        }

        function loadScreenTexture(path, onLoad) {
            new THREE.TextureLoader().load(path, (texture) => {
                texture.encoding = THREE.sRGBEncoding;
                texture.flipY = false; // GLB UVs already use glTF's top-left origin
                texture.generateMipmaps = false; // 1920x1080 is not power-of-two
                texture.minFilter = THREE.LinearFilter;
                texture.anisotropy = renderer.capabilities.getMaxAnisotropy(); // ให้คมตอนมองมุมเฉียง
                texture.wrapS = THREE.ClampToEdgeWrapping;
                texture.wrapT = THREE.ClampToEdgeWrapping;
                texture.needsUpdate = true;
                onLoad(texture);
            }, undefined, (error) => {
                // ไม่งั้นภาพบนจอจะเป็นสีดำเงียบ ๆ โดยไม่บอกเหตุผล ต้อง log ให้เห็นชัด
                console.error('Error loading screen texture: ' + path, error);
            });
        }

        loadScreenTexture(LANG.th.texture, (t) => { screenTextures.th = t; applyLanguage(); });
        loadScreenTexture(LANG.en.texture, (t) => { screenTextures.en = t; applyLanguage(); });

        // จัดวางฉากให้อยู่กลางมุมมอง ต้องรอให้ครบทุกไฟล์ก่อน
        function frameClassroom() {
            const box = new THREE.Box3().setFromObject(classroom);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 2.5 / maxDim;
            classroom.scale.setScalar(scale);
            classroom.position.sub(center.multiplyScalar(scale));
            // ต้องวางไฟหลัง scale/position ของฉากเสร็จ ไฟถึงจะได้ตำแหน่งโลกที่ถูกต้อง
            placeStickSpot();
            placeMedalLights();
        }

        // วางไฟเหลืองให้เล็งตัวละคร โดยวัดจากกล่องขอบเขตจริงแทนการ hardcode
        // เพราะ frameClassroom() สเกลฉากทั้งก้อน ตำแหน่งโลกของตัวละครจึงเปลี่ยนตามโมเดลที่โหลดมา
        // ไฟต้องอยู่ใน scene graph และ target ต้องอยู่ใน scene ด้วย ไม่งั้นทิศทางลำแสงจะไม่อัปเดต
        // เริ่มต้นซ่อนไว้ แสงจะขึ้นตอนชี้ตัวละครหรือกำลังเล่น animation เท่านั้น
        function placeStickSpot() {
            if (!stickmanRoot) return;
            // ต้องอัปเดต matrixWorld ของกลุ่มก่อนเสมอ
            // updateMatrixWorld ของตัวละครอ่านค่าจาก parent แล้วเอาไปคูณต่อ แต่ไม่ไล่ขึ้นไปอัปเดตให้
            // ถ้ากลุ่มเพิ่งถูก frameClassroom() สเกลใหม่ ค่าที่วัดได้จะเป็นของก่อนสเกล
            // (ไฟจะยิงไกลเกินจริงจน falloff หมด ไม่เหลือสีเหลืองให้เห็น)
            classroom.updateMatrixWorld(true);
            stickmanRoot.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(stickmanRoot);
            if (box.isEmpty()) return;
            const center = box.getCenter(new THREE.Vector3());
            if (!stickSpot) {
                stickSpot = new THREE.SpotLight(
                    STICK_SPOT_COLOR,
                    STICK_SPOT_INTENSITY,
                    STICK_SPOT_DISTANCE,
                    STICK_SPOT_ANGLE,
                    STICK_SPOT_PENUMBRA,
                    STICK_SPOT_DECAY
                );
                stickSpot.castShadow = false;
                stickSpot.visible = false;
                scene.add(stickSpot);
                scene.add(stickSpot.target);
            }
            stickSpot.position.set(center.x, box.max.y + STICK_SPOT_HEIGHT, center.z + STICK_SPOT_FRONT);
            stickSpot.target.position.copy(center);
            console.log('Stickman spot:', stickSpot.position.toArray().map((v) => +v.toFixed(3)),
                '-> target', center.toArray().map((v) => +v.toFixed(3)));
        }

        // ไฟส่องเหรียญเฉพาะ (Silver/Bronze) วัดตำแหน่งโลกจริงหลัง frameClassroom() scale
        // Gold ไม่สร้างสปอต ใช้ไฟเดิมในฉากอย่างเดียว
        // ติดเฉพาะตอน inspect เหรียญนั้น (คลิก) ไม่ติดตอนชี้ hover — ดับเองเมื่อ medalFocus เคลียร์
        // ไฟอยู่ใน scene graph + target อยู่ใน scene ทิศลำแสงถึงอัปเดต (แบบเดียวกับ placeStickSpot)
        function placeMedalLights() {
            classroom.updateMatrixWorld(true);
            const jobs = [
                ['silver', medalSilverRoot],
                ['bronze', medalBronzeRoot]
            ];
            jobs.forEach(([kind, root]) => {
                if (!root) return;
                root.updateMatrixWorld(true);
                const box = new THREE.Box3().setFromObject(root);
                if (box.isEmpty()) return;
                const center = box.getCenter(new THREE.Vector3());
                let entry = null;
                for (const e of medalSpots) { if (e.kind === kind) { entry = e; break; } }
                if (!entry) {
                    const spot = new THREE.SpotLight(
                        MEDAL_SPOT_COLOR,
                        MEDAL_SPOT_INTENSITY,
                        MEDAL_SPOT_DISTANCE,
                        MEDAL_SPOT_ANGLE,
                        MEDAL_SPOT_PENUMBRA,
                        MEDAL_SPOT_DECAY
                    );
                    spot.castShadow = false;
                    spot.visible = false; // เริ่มดับไว้ ติดเฉพาะตอน inspect เหรียญนั้น
                    scene.add(spot);
                    scene.add(spot.target);
                    entry = { kind: kind, spot: spot };
                    medalSpots.push(entry);
                }
                entry.spot.position.set(center.x, box.max.y + MEDAL_SPOT_HEIGHT, center.z + MEDAL_SPOT_FRONT);
                entry.spot.target.position.copy(center);
                console.log('Medal spot[' + kind + ']:',
                    entry.spot.position.toArray().map((v) => +v.toFixed(3)),
                    '-> target', center.toArray().map((v) => +v.toFixed(3)));
            });
        }

        const loader = new THREE.GLTFLoader();
        MODEL_FILES.forEach((file) => {
            loader.load(ASSET_BASE + file, (gltf) => {
                classroom.add(gltf.scene);
                gltf.scene.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                // แท่นเพลงยืนอยู่ระหว่างกล้องกับจอ พอกล้องล็อกหน้าจอจะบังภาพ จึงต้องซ่อนตอนฟักส์
                if (file === 'MusicStandSheetPlateModel.glb') focusHidden.push(gltf.scene);

                // ProjectorScreenModel.glb: ค่าเริ่มต้นเป็นจอปิด (ACT_01 เป็นภาพนิ่ง scale.y = 0.02)
                // node ใน GLB ไม่มี scale ใน rest TRS ค่า default ของ three.js จึงเป็นจอกาง ต้องเล่น clip นี้ถึงจะปิดได้
                if (file === 'ProjectorScreenModel.glb') {
                    screenSurface = gltf.scene.getObjectByName('Screen_Surface');
                    screenHousing = gltf.scene.getObjectByName('Screen_Housing');
                    if (!screenSurface) console.error('Screen_Surface not found in ProjectorScreenModel.glb');
                    if (!screenHousing) console.error('Screen_Housing not found in ProjectorScreenModel.glb');

                    if (screenSurface) {
                        // ผิวจอเป็นภาพฉาย ไม่ต้องรับแสงในฉาก:
                        // ปิด diffuse (color = 0) กัน hotspot ขาวโพลนจาก pointLight กลางห้อง
                        // (ฉากถูก frameClassroom() สเกลเหลือ ~2.5 หน่วย ไฟจึงอยู่ใกล้จอมาก)
                        // ปิด specular (roughness = 1, metalness = 0) กันเงาแวะเวลาหมุนมุมหน้าจอ
                        // ความสว่างที่เหลือคุมด้วย SCREEN_EMISSIVE ที่ applyLanguage() ที่เดียว
                        const screenMat = screenSurface.material;
                        screenMat.color.set(0x000000);
                        screenMat.roughness = 1;
                        screenMat.metalness = 0;
                        screenMat.needsUpdate = true;
                    }

                    // Screen_Control คือ Empty ที่ยุบ/กางจอทั้งชุด
                    screenMixer = new THREE.AnimationMixer(gltf.scene);
                    for (const key in SCREEN_CLIPS) {
                        const name = SCREEN_CLIPS[key];
                        // exporter อาจเติม suffix ชื่อ slot ไว้ท้าย จึงใช้ prefix match
                        const clip = gltf.animations.find((c) => c.name.indexOf(name) === 0);
                        if (clip) {
                            screenActions[name] = screenMixer.clipAction(clip);
                        } else {
                            console.error('Animation clip not found:', name);
                        }
                    }
                    console.log('Screen clips:', gltf.animations.map((c) => c.name).join(', '));

                    // default state on first load: screen open (ACT_02)
                    playScreenAction(SCREEN_CLIPS.open);
                    applyLanguage();

                    // ป้ายข้อความผูกเป็น child ของกล่อง จะตามตำแหน่งอัตโนมัติ
                    // ยกขึ้นข้างบน 0.45 หน่วย เพราะตัวกล่องสูงจริงแค่ ~0.12 หน่วย
                    if (screenHousing) {
                        const labelEl = document.createElement('div');
                        labelEl.className = 'pin-label';
                        screenLabel = new THREE.CSS2DObject(labelEl);
                        screenLabel.position.set(0, 0.45, 0);
                        screenLabel.visible = false;
                        screenHousing.add(screenLabel);
                    }
                }

                // Stickman_Flat.glb: ตัวละครนักนำวางไม้ ยืนหน้าแท่นเพลง
                // เท้าอยู่ที่ y=0 อยู่แล้วในไฟล์ จึงวางแค่ z
                // หน้าตัวละครชี้ +Z อยู่แล้ว เพราะเท้ายื่นไป -Z แล้ว root หมุน 180 รอบ Y มาแล้ว
                if (file === 'Stickman_Flat.glb') {
                    gltf.scene.position.set(0, 0, -1.2);
                    stickmanRoot = gltf.scene;
                    focusHidden.push(gltf.scene); // ตัวละครสูงกว่าจอและยืนอยู่ระหว่างกล้องกับจอ จึงต้องซ่อนตอนฟักส์

                    stickmanMixer = new THREE.AnimationMixer(gltf.scene);
                    // exporter อาจเติม suffix ชื่อ slot ไว้ท้าย จึงใช้ prefix match
                    const stickClip = gltf.animations.find((c) => c.name.indexOf(STICKMAN_CLIP) === 0);
                    if (stickClip) {
                        stickmanAction = stickmanMixer.clipAction(stickClip);
                        stickmanAction.setLoop(THREE.LoopRepeat, Infinity);
                    } else {
                        console.error('Animation clip not found:', STICKMAN_CLIP);
                    }
                    console.log('Stickman clips:', gltf.animations.map((c) => c.name).join(', '));

                    let tinted = 0;
                    gltf.scene.traverse((child) => {
                        if (child.isMesh && child.material && child.material.name === 'Mat_Stick_Black') {
                            child.material.color.setHex(STICKMAN_BODY_COLOR);
                            tinted++;
                        }
                    });
                    if (!tinted) console.error('Mat_Stick_Black not found in Stickman_Flat.glb');

                    // ป้ายข้อความผูกไว้เหนือหัวตัวละคร จะตามตำแหน่งอัตโนมัติ
                    // หาขอบเขตใน local space ก่อน เพราะฉากถูก frameClassroom() สเกลทีหลัง
                    // ถ้าวัดเป็น world space ตอนนี้ป้ายจะเพี้ยนตำแหน่งไปตอนสเกล
                    gltf.scene.updateMatrixWorld(true);
                    const toLocal = new THREE.Matrix4().copy(gltf.scene.matrixWorld).invert();
                    const stickBox = new THREE.Box3().setFromObject(gltf.scene).applyMatrix4(toLocal);
                    if (!stickBox.isEmpty()) {
                        const labelEl = document.createElement('div');
                        labelEl.className = 'pin-label';
                        stickLabel = new THREE.CSS2DObject(labelEl);
                        const stickCenter = stickBox.getCenter(new THREE.Vector3());
                        // ยกขึ้นจากยอดตัวละคร 0.3 หน่วย (translateY(-100%) ของ .pin-label ยกป้ายให้อยู่เหนือจุดนี้)
                        stickLabel.position.set(stickCenter.x, stickBox.max.y + 0.3, stickCenter.z);
                        stickLabel.visible = false;
                        gltf.scene.add(stickLabel);
                    }
                }

                // ===== 3 เหรียญ: โชว์ Shader คนละแบบ =====
                // Gold = Cel (Toon 3-step + ขอบดำ inverted hull)
                if (file === 'GoldCoin.glb') {
                    medalGoldRoot = gltf.scene;
                    applyCel(gltf.scene, 'GoldCoin.glb', { steps: GOLD_CEL_STEPS, outlineScale: GOLD_CEL_OUTLINE_SCALE });
                    medalGoldLabel = attachMedalLabel(gltf.scene, 'gold');
                    refreshMedalLabels();
                    focusHidden.push(gltf.scene); // เหรียญวางหน้าห้องบังจอตอนกล้องล็อก ต้องซ่อนพร้อมแท่นเพลง/ตัวละคร
                }

                // Silver = PBR (คงสีเดิม ปรับ metalness/roughness ใช้ไฟเดิม ไม่เพิ่ม env)
                if (file === 'SilverCoin.glb') {
                    medalSilverRoot = gltf.scene;
                    applyPBR(gltf.scene, 'SilverCoin.glb');
                    medalSilverLabel = attachMedalLabel(gltf.scene, 'silver');
                    refreshMedalLabels();
                    focusHidden.push(gltf.scene); // เหรียญวางหน้าห้องบังจอตอนกล้องล็อก ต้องซ่อนพร้อมแท่นเพลง/ตัวละคร
                }

                // Bronze = Vertex Shader (onBeforeCompile + uTime wobble ตาม normal)
                if (file === 'BronzeCoin.glb') {
                    medalBronzeRoot = gltf.scene;
                    applyBronzeVertex(gltf.scene);
                    medalBronzeLabel = attachMedalLabel(gltf.scene, 'bronze');
                    refreshMedalLabels();
                    focusHidden.push(gltf.scene); // เหรียญวางหน้าห้องบังจอตอนกล้องล็อก ต้องซ่อนพร้อมแท่นเพลง/ตัวละคร
                }

                console.log('Model loaded: ' + ASSET_BASE + file);
                if (--pending === 0) { frameClassroom(); refreshMedalLabels(); }
            }, undefined, (error) => {
                // โหลดไฟล์ใดไม่ได้ก็ยังจัดวางฉากที่เหลือ ไม่ค้างทั้งฉาก
                console.error('Error loading ' + ASSET_BASE + file + ':', error);
                if (--pending === 0) frameClassroom();
            });
        });

        function animate(t) {
            // ดึง delta ครั้งเดียวแล้วใช้ทั้งจอกับตัวละคร
            // ถ้าเรียก clock.getDelta() แยกทีละตัว ครั้งที่สองจะได้ ~0 แล้วตัวละครจะนิ่ง
            const dt = clock.getDelta();
            if (screenMixer) screenMixer.update(dt);
            if (stickmanMixer && stickmanPlaying) stickmanMixer.update(dt);
            // Vertex wobble เหรียญทองแดง: เวลาเดียวแชร์ทุก material (t ของ rAF เป็น ms)
            bronzeTime.value = (typeof t === 'number' ? t : performance.now()) * 0.001;
            settleScreenState();

            // ยิง raycast ทีเดียวต่อเฟรม ไม่ใช่ทุก pointermove
            // ตอนลากหมุนกล้อง object ขยับใต้เมาส์ที่หยุดนิ่ง วิธีนี้ hover จะตรงเสมอ
            // ป้ายบอกว่าจะกดแล้วเกิดอะไร: ปิดอยู่ -> "เปิด" (ฉายภาพ) / เปิดอยู่ -> "ปิด" (หยุดฉาย)
            // ระหว่างยุบ/กางอยู่กดไม่ได้ จึงไม่ขึ้นป้ายและไม่เปลี่ยน cursor
            // ล็อกกล้องอยู่: ปิด interaction ทั้งหมด ไม่ขึ้นป้าย cursor ปกติ (ออกด้วย Back/Esc เท่านั้น)
            if (focusMode) {
                document.body.style.cursor = 'default';
                setLabel(screenLabel, '', false);
                // ตัวละครถูกซ่อนตอนฟักส์ ป้ายของมันต้องหายตาม ไม่งั้นจะลอยกลางจอโดยไม่มีที่มา
                setLabel(stickLabel, '', false);
                // ป้ายเหรียญซ่อนตอนล็อกกล้องเหมือนกัน ไม่งั้นจะลอยทับคำอธิบายใน focusHint
                setLabel(medalGoldLabel, '', false);
                setLabel(medalSilverLabel, '', false);
                setLabel(medalBronzeLabel, '', false);
                // สปอตเหรียญดับตอนล็อกจอ (กล้องหันหน้าจออยู่แล้ว)
                for (const e of medalSpots) e.spot.visible = false;
                // ไฟเหลืองต้องปิดตามตัวละครเหมือนกัน ไม่งั้นจะเหลือวงแสงบนพื้นที่ไม่มีตัวละคร
                if (stickSpot) stickSpot.visible = false;
            } else if (medalFocus) {
                // ล็อกเหรียญอยู่: ไม่ raycast/hover ใด ๆ cursor ปกติ ป้ายค้างเฉพาะเหรียญที่ล็อก
                // ออกได้แค่ปุ่มย้อนกลับหรือ Esc (คลิกฉากถูกบล็อกที่ pointerup แล้ว)
                document.body.style.cursor = 'default';
                setLabel(screenLabel, '', false);
                setLabel(stickLabel, '', false);
                setLabel(medalGoldLabel, MEDAL_INFO.gold[lang].tag, medalFocus === 'gold');
                setLabel(medalSilverLabel, MEDAL_INFO.silver[lang].tag, medalFocus === 'silver');
                setLabel(medalBronzeLabel, MEDAL_INFO.bronze[lang].tag, medalFocus === 'bronze');
                for (const e of medalSpots) e.spot.visible = (medalFocus === e.kind && e.kind !== 'gold');
                if (stickSpot) stickSpot.visible = stickmanPlaying;
            } else {
                const hovering = pickHousing();
                const clickable = hovering && (canOpenScreen() || canCloseScreen());
                // ผิวจออยู่หลังกล่องจอ ให้กล่องจอได้สิทธิ์ก่อนเสมอ
                const onSurface = !clickable && canFocusScreen() && pickSurface();
                // 3 เหรียญอยู่คนละจุดกับจอ/ตัวละคร เช็คหลังจอ แต่ก่อนตัวละคร (เหรียญเล็กกว่าต้องได้สิทธิ์ก่อน)
                const onGold = !clickable && !onSurface && pickMedal(medalGoldRoot);
                const onSilver = !clickable && !onSurface && !onGold && pickMedal(medalSilverRoot);
                const onBronze = !clickable && !onSurface && !onGold && !onSilver && pickMedal(medalBronzeRoot);
                const onMedal = onGold || onSilver || onBronze;
                // ตัวละครอยู่ไกลจอมากจึงไม่ชนกับการคลิกจอ เช็คต่อท้ายสุดได้เลย
                // ยิงครั้งเดียวแล้วใช้ทั้ง cursor, ป้าย และไฟ ไม่ยิงซ้ำหลายรอบต่อเฟรม
                const onStickman = !clickable && !onSurface && !onMedal && pickStickman();
                document.body.style.cursor = clickable ? 'pointer' : (onSurface || onMedal ? 'zoom-in' : (onStickman ? 'pointer' : 'default'));
                const actionText = canCloseScreen() ? LANG[lang].close : LANG[lang].open;
                setLabel(screenLabel, actionText, clickable);
                // ป้ายเหรียญบอกเทคนิค shader ของเหรียญนั้น (ข้อความตามภาษาใน refreshMedalLabels)
                // เหรียญที่ inspect อยู่ป้ายค้างไว้ ที่เหลือโชว์ตอน hover
                setLabel(medalGoldLabel, MEDAL_INFO.gold[lang].tag, onGold || medalFocus === 'gold');
                setLabel(medalSilverLabel, MEDAL_INFO.silver[lang].tag, onSilver || medalFocus === 'silver');
                setLabel(medalBronzeLabel, MEDAL_INFO.bronze[lang].tag, onBronze || medalFocus === 'bronze');
                // สปอตเหรียญติดเฉพาะตอน inspect (คลิก) ไม่ติดตอนชี้ hover
                // เลิก inspect (medalFocus=null) เมื่อไหร่ ไฟดับเฟรมถัดไปเอง ไม่ต้องแตะฟังก์ชันออก
                // Gold ไม่มีสปอต (ไม่สร้างใน placeMedalLights) กันเหนียวปิดไว้ด้วยเงื่อนไข kind
                for (const e of medalSpots) e.spot.visible = (medalFocus === e.kind && e.kind !== 'gold');
                // ป้ายตัวละครบอกว่าจะกดแล้วเกิดอะไร: หยุดอยู่ -> "เล่น" (การนักนำ) / เล่นอยู่ -> "หยุด"
                setLabel(stickLabel, stickmanPlaying ? LANG[lang].pause : LANG[lang].play, onStickman);
                // ไฟเหลืองขึ้นตอนชี้ตัวละคร และค้างต่อระหว่างที่ animation กำลังเล่น
                // (เอาเมาส์ออกแล้วไฟดับทันทีถ้าไม่ได้กดเล่นไว้)
                if (stickSpot) stickSpot.visible = onStickman || stickmanPlaying;
            }

            // ย้ายกล้องแบบลื่นไปหน้าจอ แล้วค่อยหยุดนิ่ง
            // ต้องเลื่อน controls.target ไปพร้อมกันด้วย เพราะกล้องหันตาม target
            // (ถ้าขยับแต่ตำแหน่ง กล้องจะยังหันไปทางเดิม ไม่ได้หันหน้าจอ)
            if (focusAnim) {
                const k = Math.min((t - focusAnim.start) / FOCUS_TWEEN_MS, 1);
                const e = easeInOutCubic(k);
                camera.position.lerpVectors(focusAnim.fromPos, focusAnim.toPos, e);
                controls.target.lerpVectors(focusAnim.fromTarget, focusAnim.toTarget, e);
                if (k >= 1) {
                    camera.position.copy(focusAnim.toPos);
                    controls.target.copy(focusAnim.toTarget);
                    focusAnim = null;
                }
            }

            // controls.update() ยังทำหน้าที่หันกล้องเข้าหา target แม้ enabled = false
            // เพราะ r128 ใช้ enabled เช็คแค่ใน event handler ไม่ได้เช็คใน update
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate(0);

        // เขียนข้อความในป้ายเมื่อข้อความเปลี่ยนเท่านั้น ไม่งั้นจะแก้ DOM ทุกเฟรม
        // ข้อความว่าง = ซ่อนป้าย
        function setLabel(labelObj, text, visible) {
            if (!labelObj) return;
            labelObj.visible = visible;
            const el = labelObj.element;
            const want = visible ? text : '';
            if (el.textContent !== want) el.textContent = want;
        }

        // คลิกกล่องจอเพื่อเปิด/ปิดภาพฉาย
        // ใช้ pointerdown/pointerup + ระยะการเคลื่อนที่ เพื่อแยก "คลิก" ออกจาก "ลากหมุนมุมมอง"
        // ของ OrbitControls ซึ่งใช้ปุ่มซ้ายเหมือนกัน
        renderer.domElement.addEventListener('pointermove', (event) => {
            pointerX = event.clientX;
            pointerY = event.clientY;
            pointerInside = true;
        });

        renderer.domElement.addEventListener('pointerleave', () => {
            pointerInside = false;
        });

        renderer.domElement.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) return;
            pointerDownX = event.clientX;
            pointerDownY = event.clientY;
        });

        renderer.domElement.addEventListener('pointerup', (event) => {
            if (event.button !== 0) return;
            const dragged = Math.hypot(event.clientX - pointerDownX, event.clientY - pointerDownY);
            if (dragged > CLICK_MAX_DRAG) return; // เป็นการลากหมุนมุมมอง ไม่ใช่การคลิก
            if (focusMode) return; // ล็อกกล้องอยู่ คลิกฉากไม่ทำอะไร ออกด้วย Back/Esc เท่านั้น
            if (medalFocus) return; // inspect เหรียญอยู่ คลิกฉากไม่ทำอะไร ออกด้วย Back/Esc เท่านั้น
            pointerX = event.clientX;
            pointerY = event.clientY;
            pointerInside = true;
            // กล่องจอมาก่อน เพราะผิวจอทับกล่องอยู่ตอนจอกาง
            // คลิกกล่อง = สลับเปิด/ปิดฉาย / คลิกผิวจอตอนเปิดนิ่ง = ล็อกกล้องหน้าจอ
            // คลิกเหรียญ = inspect (เข้าได้เฉพาะตอนยังไม่ล็อกเหรียญอื่น) / คลิกตัวละคร = เล่น/หยุด animation
            // (ถึงจุดนี้ medalFocus เป็น null เสมอ เพราะมีการ์ดด้านบน — ไม่มีการสลับ/ล้าง inspect จากคลิกฉาก)
            if (pickHousing()) {
                toggleScreen();
            } else if (canFocusScreen() && pickSurface()) {
                enterScreenFocus();
            } else if (pickMedal(medalGoldRoot)) {
                enterMedalInspect('gold');
            } else if (pickMedal(medalSilverRoot)) {
                enterMedalInspect('silver');
            } else if (pickMedal(medalBronzeRoot)) {
                enterMedalInspect('bronze');
            } else if (pickStickman()) {
                exitMedalInspect();
                toggleStickman();
            } else {
                exitMedalInspect();
            }
        });

        // ปุ่มภาษา: เปลี่ยนภาพบนจอ + ข้อความป้ายพร้อมกัน
        const langButtons = document.querySelectorAll('#lang button');
        langButtons.forEach((btn) => {
            btn.addEventListener('click', () => {
                lang = btn.dataset.lang;
                langButtons.forEach((b) => b.classList.toggle('on', b === btn));
                focusBack.textContent = LANG[lang].back;
                // ตอนล็อกเหรียญอยู่ hint ต้องเป็นคำอธิบาย shader ภาษานั้น ไม่ใช่ hint จอ
                focusHint.textContent = medalFocus ? MEDAL_INFO[medalFocus][lang].hint : LANG[lang].hint;
                refreshMedalLabels();
                applyLanguage();
            });
        });

        // ทางออกจากโหมดล็อกกล้อง/โหมด inspect เหรียญ: ปุ่มย้อนกลับ หรือปุ่ม Esc
        // (แต่ละฟังก์ชันมีการ์ดภายในตัวเอง เรียกคู่กันได้ อันไหนไม่ active ก็ไม่ทำอะไร)
        focusBack.addEventListener('click', () => { exitMedalInspect(); exitScreenFocus(); });
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' || event.key === 'Esc') { exitMedalInspect(); exitScreenFocus(); }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            // ล็อดอยู่ต้องคำนวณระยะใหม่ตาม aspect ใหม่ ไม่งั้นจอจะล้นเฟรมหรือเล็กเกินไป
            if (focusMode) {
                // โฟกัสเหรียญให้เฟรมเหรียญนั้น โฟกัสจอให้เฟรมจอ
                if (medalFocus) frameObjectCamera(medalRootOf(medalFocus), MEDAL_FOCUS_MARGIN, MEDAL_FOCUS_MIN_DIST);
                else frameScreenCamera();
                camera.position.copy(focusPos);
                controls.target.copy(focusCenter);
            }
        });

    </script>
</body>

</html>
